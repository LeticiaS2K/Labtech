{% extends "layout.html" %}
{% block content %}
  <h2>Login</h2>
  <form method="post">
    <label for="email">E-mail</label><br>
    <input id="email" name="email" type="email" required><br><br>

    <label for="senha">Senha</label><br>
    <input id="senha" name="senha" type="password" required><br><br>

    <button type="submit">Entrar</button>
  </form>
{% endblock %}
