{% extends "layout.html" %}
{% block content %}
  <h2>Devolução de chaves</h2>

  <div>
    <h3>Entrega selecionada</h3>
    <p><strong>Chave:</strong> {{ entrega.chave.identificacao }}</p>
    <p><strong>Retirado por:</strong> {{ entrega.usuario }}</p>
    <p><strong>Data retirada:</strong> {{ entrega.data_retirada }}</p>
    <p><strong>Status:</strong> {{ entrega.status }}</p>
  </div>

  <form method="post">
    <label for="data_devolucao">Data e hora de entrega (ISO) - Ex: 2025-10-21T11:38</label><br>
    <input id="data_devolucao" name="data_devolucao" required placeholder="YYYY-MM-DDTHH:MM"><br><br>

    <button type="submit">Confirmar devolução</button>
  </form>
{% endblock %}
